[project]
name = "dynamicalsystem.listing"
version = "0.1.0"
description = "BFI IMAX listing scraper and presentation system"
requires-python = ">=3.13"
dependencies = [
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "feedgen>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamicalsystem"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "responses>=0.24.0",
]
